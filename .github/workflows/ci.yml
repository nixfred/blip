name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Audio probe regression dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -q ffmpeg
      - name: unit tests (collector, thread, tier2, ui invariants)
        run: bun test
      - name: QML badge regression (synthetic data, no desktop needed)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q qt6-declarative-dev-tools qml6-module-qttest qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript
          python3 scripts/test-read-ui.py
      - name: Composer emoji keyboard regression
        run: |
          sudo apt-get install -y -q qml6-module-qtquick-controls qml6-module-qtquick-templates
          python3 scripts/test-composer-emoji-ui.py
      - name: Inline audio playback and captured play intent
        run: |
          sudo apt-get install -y -q ffmpeg qml6-module-qtmultimedia qml6-module-qtquick-controls qml6-module-qtquick-templates
          python3 scripts/test-audio-ui.py
          python3 scripts/test-audio-session-ui.py
          python3 scripts/test-audio-loader.py
      - name: Searchable reaction picker (synthetic QtTest)
        run: |
          sudo apt-get install -y -q qml6-module-qtquick-controls qml6-module-qtquick-templates
          python3 scripts/test-reaction-ui.py
      - name: OTP desktop adapter (no desktop needed)
        run: |
          python3 -m py_compile otp-desktop.py
          python3 test_otp_desktop.py
      - name: Mac tools compile (python3 syntax, no macOS needed)
        run: python3 -m py_compile bridge/linux/blip-bridged bridge/mac/imsg bridge/mac/imsg-send bridge/mac/contacts bridge/mac/tcc-check bridge/mac/blip-check bridge/mac/blip-dispatch bridge/mac/imsg-read bridge/mac/imsg-react bridge/mac/calling_codes.py bridge/mac/contact-save bridge/mac/read_state.py bridge/mac/findmy_city.py
      - name: Sticker metadata and bounded animated rendering
        run: |
          sudo apt-get install -y -q ffmpeg imagemagick qt6-image-formats-plugins
          python3 bridge/mac/test_stickers.py
          python3 scripts/test-sticker-ui.py
      - name: shared city (synthetic AX and Contacts, no macOS needed)
        run: python3 bridge/mac/test_findmy_city.py
      - name: read pushes require verified completion (no macOS needed)
        run: python3 bridge/mac/test_read_verification.py
      - name: read state and action verification (synthetic SQLite, no macOS needed)
        run: python3 bridge/mac/test_read_sync.py
      - name: reactions are read from the window's oldest message onward, exactly as before (synthetic SQLite, no macOS needed)
        run: python3 bridge/mac/test_tapback_window.py
      - name: group-photo lookup (no macOS needed)
        run: python3 bridge/mac/test_group_photo.py
      - name: phone matching, the way Contacts does it (no macOS needed)
        run: python3 bridge/mac/test_phone_match.py
      - name: iMessage app cards read as text (no macOS needed)
        run: python3 bridge/mac/test_app_cards.py
      - name: unsent messages are tombstones, not empty bubbles (no macOS needed)
        run: python3 bridge/mac/test_unsent.py
      - name: a voice message gets its MIME from the UTI (no macOS needed)
        run: python3 bridge/mac/test_attachment_mime.py
      - name: a waiting Send Later is flagged, never "sent" (no macOS needed)
        run: python3 bridge/mac/test_scheduled.py
      - name: conversation cluster pins (no macOS needed)
        run: python3 bridge/mac/test_cluster.py
      - name: the optional read-push probe stays opt-in (no macOS needed)
        run: python3 bridge/mac/test_blip_check.py
      - name: read pushes address groups and restore focus (no macOS needed)
        run: python3 bridge/mac/test_read.py
      - name: tapbacks are verified by chat.db, pressed once and never mid-scroll (no macOS needed)
        run: |
          python3 bridge/mac/test_react.py
          python3 bridge/mac/test_reaction_kind.py
      - name: hide Spam / unknown senders (no macOS needed)
        run: python3 bridge/mac/test_filtered.py
      - name: contact review across sources (no macOS needed)
        run: python3 bridge/mac/contacts_test.py
      - name: imsg chat metadata (no macOS needed)
        run: python3 bridge/mac/imsg_test.py
      - name: stamps cross the bridge as UTC (no macOS needed)
        run: python3 bridge/mac/test_wire_time.py
      - name: contact creation (synthetic fixtures)
        run: python3 bridge/mac/test_contact_save.py
      - name: the serve channel exposes only read-only queries (no macOS needed)
        run: python3 bridge/mac/test_serve.py
      - name: blip-bridged validates bridge.conf like the shim (no macOS needed)
        run: python3 bridge/linux/test_bridged_conf.py
      - name: blip-bridged socket trust, deadlines, filter parity (mocked ssh, no network)
        run: python3 bridge/linux/test_bridged.py
      - name: send waits for the Automation prompt (no macOS needed)
        run: python3 bridge/mac/test_imsg_send_wait.py
      - name: shell scripts (bash -n + shellcheck)
        run: |
          bash -n bridge/linux/blip-shim scripts/blip-setup scripts/sync-bridge.sh scripts/demo/blip-shots bridge/mac/install.sh
          sudo apt-get install -y -q shellcheck >/dev/null
          shellcheck -S warning bridge/linux/blip-shim scripts/blip-setup scripts/sync-bridge.sh bridge/mac/install.sh
