name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: unit tests (collector, thread, tier2, ui invariants)
        run: bun test
      - name: Mac tools compile (python3 syntax, no macOS needed)
        run: python3 -m py_compile bridge/mac/imsg bridge/mac/imsg-send bridge/mac/contacts bridge/mac/tcc-check bridge/mac/blip-check bridge/mac/blip-dispatch bridge/mac/imsg-read bridge/mac/calling_codes.py bridge/mac/contact-save
      - name: group-photo lookup (no macOS needed)
        run: python3 bridge/mac/test_group_photo.py
      - name: phone matching, the way Contacts does it (no macOS needed)
        run: python3 bridge/mac/test_phone_match.py
      - name: iMessage app cards read as text (no macOS needed)
        run: python3 bridge/mac/test_app_cards.py
      - name: unsent messages are tombstones, not empty bubbles (no macOS needed)
        run: python3 bridge/mac/test_unsent.py
      - name: conversation cluster pins (no macOS needed)
        run: python3 bridge/mac/test_cluster.py
      - name: the optional read-push probe stays opt-in (no macOS needed)
        run: python3 bridge/mac/test_blip_check.py
      - name: hide Spam / unknown senders (no macOS needed)
        run: python3 bridge/mac/test_filtered.py
      - name: contact review across sources (no macOS needed)
        run: python3 bridge/mac/contacts_test.py
      - name: imsg chat metadata (no macOS needed)
        run: python3 bridge/mac/imsg_test.py
      - name: stamps cross the bridge as UTC (no macOS needed)
        run: python3 bridge/mac/test_wire_time.py
      - name: contact creation (synthetic fixtures)
        run: python3 bridge/mac/test_contact_save.py
      - name: shell scripts (bash -n + shellcheck)
        run: |
          bash -n bridge/linux/blip-shim scripts/blip-setup scripts/sync-bridge.sh scripts/demo/blip-shots bridge/mac/install.sh
          sudo apt-get install -y -q shellcheck >/dev/null
          shellcheck -S warning bridge/linux/blip-shim scripts/blip-setup scripts/sync-bridge.sh bridge/mac/install.sh
